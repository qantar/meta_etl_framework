# ==========================================
# docker-compose.yml
# Complete Production Stack for ETL Framework
# ==========================================

version: '3.8'

networks:
  etl-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-source-data:
  postgres-target-data:
  postgres-metadata-data:
  redis-data:
  minio-data:
  grafana-data:
  prometheus-data:
  elasticsearch-data:
  etl-logs:
  etl-data:
  etl-backup:

services:
  # ==========================================
  # DATABASE SERVICES
  # ==========================================
  
  postgres-source:
    image: postgres:15-alpine
    container_name: etl-postgres-source
    restart: unless-stopped
    environment:
      POSTGRES_DB: source_db
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD:-etl_source_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
      - ./sql/sample_source_data.sql:/docker-entrypoint-initdb.d/01-sample-data.sql
    networks:
      etl-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d source_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-target:
    image: postgres:15-alpine
    container_name: etl-postgres-target
    restart: unless-stopped
    environment:
      POSTGRES_DB: target_db
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD:-etl_target_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres-target-data:/var/lib/postgresql/data
      - ./sql/target_init.sql:/docker-entrypoint-initdb.d/01-target-init.sql
    networks:
      etl-network:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d target_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-metadata:
    image: postgres:15-alpine
    container_name: etl-postgres-metadata
    restart: unless-stopped
    environment:
      POSTGRES_DB: metadata_db
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:-etl_metadata_password}
    ports:
      - "5434:5432"
    volumes:
      - postgres-metadata-data:/var/lib/postgresql/data
      - ./sql/metadata_ddl.sql:/docker-entrypoint-initdb.d/01-metadata-ddl.sql
    networks:
      etl-network:
        ipv4_address: 172.20.0.12
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d metadata_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # CACHE & MESSAGE QUEUE
  # ==========================================
  
  redis:
    image: redis:7-alpine
    container_name: etl-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-etl_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      etl-network:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # OBJECT STORAGE
  # ==========================================
  
  minio:
    image: minio/minio:latest
    container_name: etl-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-etl_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-etl_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      etl-network:
        ipv4_address: 172.20.0.30
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # ETL FRAMEWORK SERVICES
  # ==========================================
  
  etl-python:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: etl-python-engine
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - ETL_CONFIG_PATH=/app/config/production.yaml
      - SOURCE_DB_PASSWORD=${SOURCE_DB_PASSWORD:-etl_source_password}
      - TARGET_DB_PASSWORD=${TARGET_DB_PASSWORD:-etl_target_password}
      - METADATA_DB_PASSWORD=${METADATA_DB_PASSWORD:-etl_metadata_password}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-etl_redis_password}
      - MINIO_USER=${MINIO_USER:-etl_minio_user}
      - MINIO_PASSWORD=${MINIO_PASSWORD:-etl_minio_password}
      - API_TOKEN=${API_TOKEN:-dev-token}
    ports:
      - "8080:8080"
    volumes:
      - etl-logs:/app/logs
      - etl-data:/app/data
      - etl-backup:/app/backup
    depends_on:
      postgres-source:
        condition: service_healthy
      postgres-target:
        condition: service_healthy
      postgres-metadata:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      etl-network:
        ipv4_address: 172.20.0.100
    command: ["python", "-m", "uvicorn", "src.api.rest_server:app", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 3

  etl-spark:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: etl-spark-engine
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - ETL_CONFIG_PATH=/app/config/production.yaml
      - SPARK_MASTER_URL=local[*]
      - SPARK_DRIVER_MEMORY=2g
      - SPARK_EXECUTOR_MEMORY=4g
      - SPARK_EXECUTOR_CORES=2
      - SOURCE_DB_PASSWORD=${SOURCE_DB_PASSWORD:-etl_source_password}
      - TARGET_DB_PASSWORD=${TARGET_DB_PASSWORD:-etl_target_password}
      - METADATA_DB_PASSWORD=${METADATA_DB_PASSWORD:-etl_metadata_password}
    volumes:
      - etl-logs:/app/logs
      - etl-data:/app/data
      - etl-backup:/app/backup
    depends_on:
      postgres-source:
        condition: service_healthy
      postgres-target:
        condition: service_healthy
      postgres-metadata:
        condition: service_healthy
    networks:
      etl-network:
        ipv4_address: 172.20.0.101
    command: ["python", "-m", "src.cli.main", "monitor", "health"]

  etl-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: etl-scheduler
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - ETL_CONFIG_PATH=/app/config/production.yaml
      - SCHEDULER_ENABLED=true
      - DEFAULT_SCHEDULE=0 2 * * *
    volumes:
      - etl-logs:/app/logs
      - etl-data:/app/data
    depends_on:
      etl-python:
        condition: service_healthy
    networks:
      etl-network:
        ipv4_address: 172.20.0.102
    command: ["python", "-m", "src.orchestration.scheduler"]

  # ==========================================
  # MONITORING STACK
  # ==========================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: etl-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerting:/etc/prometheus/alerting
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
    networks:
      etl-network:
        ipv4_address: 172.20.0.200
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: etl-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-etl_grafana_password}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      etl-network:
        ipv4_address: 172.20.0.201
    healthcheck:
      test: ["CMD-SHELL", "curl -f localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # LOGGING STACK
  # ==========================================
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: etl-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      etl-network:
        ipv4_address: 172.20.0.210
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: etl-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=changeme
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      etl-network:
        ipv4_address: 172.20.0.211
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status"]
      interval: 60s
      timeout: 30s
      retries: 3

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: etl-filebeat
    restart: unless-stopped
    user: root
    volumes:
      - ./monitoring/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - etl-logs:/var/log/etl:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      etl-network:
        ipv4_address: 172.20.0.212
    command: ["--strict.perms=false"]

  # ==========================================
  # DEVELOPMENT & DEBUGGING TOOLS
  # ==========================================
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: etl-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@etl-framework.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-etl_pgadmin_password}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8081:80"
    volumes:
      - ./monitoring/pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres-source
      - postgres-target
      - postgres-metadata
    networks:
      etl-network:
        ipv4_address: 172.20.0.220
    profiles:
      - debug

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: etl-jupyter
    restart: unless-stopped
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-etl_jupyter_token}
    ports:
      - "8888:8888"
    volumes:
      - etl-data:/app/data
      - ./notebooks:/app/notebooks
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root"]
    networks:
      etl-network:
        ipv4_address: 172.20.0.221
    profiles:
      - debug

# ==========================================
# ENVIRONMENT CONFIGURATION
# ==========================================

# Create .env file with these variables:
# SOURCE_DB_PASSWORD=your_source_password
# TARGET_DB_PASSWORD=your_target_password
# METADATA_DB_PASSWORD=your_metadata_password
# REDIS_PASSWORD=your_redis_password
# MINIO_USER=your_minio_user
# MINIO_PASSWORD=your_minio_password
# GRAFANA_PASSWORD=your_grafana_password
# PGADMIN_PASSWORD=your_pgadmin_password
# JUPYTER_TOKEN=your_jupyter_token
# API_TOKEN=your_api_token